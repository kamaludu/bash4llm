name: Extras SHA-256 Manifest Integrity

on:
  push:
    branches: [ main ]
    paths:
      - 'bash4llm'
      - 'extras/**'
      - '.github/workflows/extras-integrity-manifest.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'bash4llm'
      - 'extras/**'
      - '.github/workflows/extras-integrity-manifest.yml'
  workflow_dispatch:

jobs:
  verify-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: 1. Direct Cryptographic SHA-256 Verification
        run: |
          set -euo pipefail
          
          if [ ! -f "extras/manifest.sha256" ]; then
            echo "❌ CRITICAL ERROR: extras/manifest.sha256 is missing!"
            exit 1
          fi

          TMP_CLEAN_MANIFEST="$(mktemp)"
          grep -vE '^[[:space:]]*#' extras/manifest.sha256 | grep -vE '^[[:space:]]*$' | tr -d '\r' > "$TMP_CLEAN_MANIFEST"

          if [ ! -s "$TMP_CLEAN_MANIFEST" ]; then
            echo "❌ ERROR: manifest.sha256 contains no valid hashes!"
            rm -f "$TMP_CLEAN_MANIFEST"
            exit 1
          fi

          echo "🔍 Checking SHA-256 digests against extras/ directory..."
          (
            cd extras
            sha256sum --strict -c "$TMP_CLEAN_MANIFEST"
          )
          rm -f "$TMP_CLEAN_MANIFEST"
          echo "✅ All SHA-256 digests match manifest!"

      - name: 2. Ed25519 Signature Verification (If Signature Present)
        run: |
          set -euo pipefail

          SIG_FILE="extras/manifest.sha256.sig"
          PUBKEY_FILE="extras/official-ed25519.pub"
          MANIFEST_FILE="extras/manifest.sha256"

          if [ -f "$SIG_FILE" ]; then
            echo "🔍 Signature file detected. Verifying Ed25519 signature..."
            if [ ! -f "$PUBKEY_FILE" ]; then
              echo "❌ ERROR: Signature present but $PUBKEY_FILE missing!"
              exit 1
            fi

            if command -v openssl >/dev/null 2>&1; then
              openssl pkeyutl -verify -pubin -inkey "$PUBKEY_FILE" -rawin -in "$MANIFEST_FILE" -sigfile "$SIG_FILE"
              echo "✅ Ed25519 signature verified successfully via OpenSSL!"
            elif command -v ssh-keygen >/dev/null 2>&1; then
              ssh-keygen -Y verify -f "$PUBKEY_FILE" -I "bash4llm-manifest" -n "file" -s "$SIG_FILE" < "$MANIFEST_FILE"
              echo "✅ Ed25519 signature verified successfully via ssh-keygen!"
            else
              echo "❌ ERROR: Neither openssl nor ssh-keygen available for signature verification!"
              exit 1
            fi
          else
            echo "ℹ️ No signature file ($SIG_FILE) present. Skipping signature check."
          fi

      - name: 3. Functional Installer Sanity Test
        run: |
          set -euo pipefail
          
          B4L_BIN="./bash4llm"
          if [ ! -f "$B4L_BIN" ]; then
            B4L_BIN=$(find . -maxdepth 2 -name "bash4llm" -type f | head -n 1 || true)
          fi

          if [ -z "$B4L_BIN" ] || [ ! -f "$B4L_BIN" ]; then
            echo "❌ ERROR: Executable file 'bash4llm' not found in repository!"
            exit 1
          fi

          chmod +x "$B4L_BIN"

          echo "🔍 Testing native extras installer..."
          INSTALL_LOG=$("$B4L_BIN" --install-extras 2>&1)
          echo "$INSTALL_LOG"

          if echo "$INSTALL_LOG" | grep -qi "integrity verification warnings"; then
            echo "❌ ERROR: Extras installer detected integrity verification warnings!"
            exit 1
          fi
          echo "✅ Installer sanity test passed!"
