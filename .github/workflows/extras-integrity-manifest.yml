name: Extras SHA-256 Manifest Integrity

on:
  push:
    branches: [ main ]
    paths:
      - 'bash4llm'
      - '.github/workflows/extras-integrity-manifest.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'bash4llm'
      - 'extras/**'
      - '.github/workflows/extras-integrity-manifest.yml'
  workflow_run:
    workflows: ["Update Extras Manifest"]
    types: [completed]
  workflow_dispatch:

jobs:
  verify-manifest:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref }}

      - name: Check All Extras Files Against SHA-256 Manifest
        run: |
          set -euo pipefail
          
          # Dynamic Path Detection
          B4L_BIN="./bash4llm"
          if [ ! -f "$B4L_BIN" ]; then
            B4L_BIN=$(find . -maxdepth 2 -name "bash4llm" -type f | head -n 1 || true)
          fi

          if [ -z "$B4L_BIN" ] || [ ! -f "$B4L_BIN" ]; then
            echo "❌ ERROR: Executable file 'bash4llm' not found in repository!"
            exit 1
          fi

          chmod +x "$B4L_BIN"
          
          if [ -d "extras" ]; then
            if [ ! -f "extras/manifest.sha256" ]; then
              echo "❌ CRITICAL ERROR: Directory 'extras' exists but 'manifest.sha256' is missing!"
              exit 1
            fi
            
            # Create temporary clean manifest in system runner tmp to avoid directory pollution
            TMP_CLEAN_MANIFEST="$(mktemp)"
            grep -vE '^[[:space:]]*#' extras/manifest.sha256 | grep -vE '^[[:space:]]*$' | tr -d '\r' > "$TMP_CLEAN_MANIFEST" || true
            
            if [ ! -s "$TMP_CLEAN_MANIFEST" ]; then
              echo "❌ ERROR: manifest.sha256 is empty or contains no valid hashes!"
              rm -f "$TMP_CLEAN_MANIFEST"
              exit 1
            fi

            # Verify cryptographic digests strictly inside extras context
            (
              cd extras
              sha256sum --strict -c "$TMP_CLEAN_MANIFEST"
            )
            rm -f "$TMP_CLEAN_MANIFEST"
            
            # Verify native bash4llm extras installer integrity test safely without hiding errors
            INSTALL_LOG=""
            if ! INSTALL_LOG=$("$B4L_BIN" --install-extras 2>&1); then
              echo "$INSTALL_LOG"
              echo "❌ ERROR: Extras installer command failed with exit code $?!"
              exit 1
            fi
            echo "$INSTALL_LOG"
            
            if echo "$INSTALL_LOG" | grep -qi "integrity verification warnings"; then
              echo "❌ ERROR: Extras installer detected integrity verification warnings!"
              exit 1
            fi
            
            echo "✅ All extra modules match official SHA-256 manifest!"
          else
            echo "ℹ️ Directory 'extras' not present. Skipping check."
          fi
