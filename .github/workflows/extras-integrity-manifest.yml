name: Extras SHA-256 Manifest Integrity & Auto-Update

on:
  push:
    branches: [ main ]
    paths:
      - 'bin/bash4llm'
      - 'extras/**'
      - '!extras/manifest.sha256'
      - '!extras/manifest.sha256.sig'
      - '.github/workflows/extras-integrity-manifest.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'bin/bash4llm'
      - 'extras/**'
      - '.github/workflows/extras-integrity-manifest.yml'
  workflow_dispatch:

jobs:
  update-and-verify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2
        with:
          token: ${{ secrets.GH_AUTOMATION_TOKEN || github.token }}
          fetch-depth: 0

      - name: 1. Generate and Sign Manifest
        env:
          ED25519_PRIVATE_KEY: ${{ secrets.ED25519_SIGNING_KEY }}
        run: |
          set -euo pipefail
          chmod +x extras/security/generate-manifest.sh
          
          if [ -n "${ED25519_PRIVATE_KEY:-}" ]; then
            echo "🔑 Private key secret detected. Generating signed manifest..."
            echo "$ED25519_PRIVATE_KEY" > /tmp/ci-private-key.pem
            chmod 600 /tmp/ci-private-key.pem
            ./extras/security/generate-manifest.sh --key /tmp/ci-private-key.pem
            rm -f /tmp/ci-private-key.pem
          else
            echo "ℹ️ Private key secret not set. Generating manifest without signature..."
            ./extras/security/generate-manifest.sh --no-sign-if-missing-key
          fi

      - name: 2. Commit & Push Official Manifest Updates (Main & Dispatch Only)
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        uses: stefanzweifel/git-auto-commit-action@v5.1.0
        with:
          commit_message: "chore(security): auto-update extras manifest & signatures"
          file_pattern: "extras/manifest.sha256*"

      - name: 3. Direct Cryptographic SHA-256 Verification
        run: |
          set -euo pipefail
          
          MANIFEST_FILE="extras/manifest.sha256"

          if [ ! -f "$MANIFEST_FILE" ]; then
            echo "❌ CRITICAL ERROR: $MANIFEST_FILE is missing!"
            exit 1
          fi

          TMP_CLEAN_MANIFEST="$(mktemp)"
          grep -vE '^[[:space:]]*#' "$MANIFEST_FILE" | grep -vE '^[[:space:]]*$' | tr -d '\r' > "$TMP_CLEAN_MANIFEST"

          if [ ! -s "$TMP_CLEAN_MANIFEST" ]; then
            echo "❌ ERROR: $MANIFEST_FILE contains no valid hashes!"
            rm -f "$TMP_CLEAN_MANIFEST"
            exit 1
          fi

          echo "🔍 Verifying SHA-256 digests in extras/..."
          (
            cd extras
            sha256sum --strict -c "$TMP_CLEAN_MANIFEST"
          )
          rm -f "$TMP_CLEAN_MANIFEST"
          echo "✅ All SHA-256 digests match manifest!"

      - name: 4. Ed25519 Signature Verification (If Signature Present)
        run: |
          set -euo pipefail

          SIG_FILE="extras/manifest.sha256.sig"
          PUBKEY_FILE="extras/official-ed25519.pub"
          MANIFEST_FILE="extras/manifest.sha256"

          if [ -f "$SIG_FILE" ]; then
            echo "🔍 Signature file detected ($SIG_FILE). Verifying Ed25519 signature..."
            if [ ! -f "$PUBKEY_FILE" ]; then
              echo "❌ ERROR: Signature file present ($SIG_FILE) but public key ($PUBKEY_FILE) is missing!"
              exit 1
            fi

            if command -v openssl >/dev/null 2>&1; then
              openssl pkeyutl -verify -pubin -inkey "$PUBKEY_FILE" -rawin -in "$MANIFEST_FILE" -sigfile "$SIG_FILE"
              echo "✅ Ed25519 signature verified successfully via OpenSSL!"
            elif command -v ssh-keygen >/dev/null 2>&1; then
              ssh-keygen -Y verify -f "$PUBKEY_FILE" -I "bash4llm-manifest" -n "file" -s "$SIG_FILE" < "$MANIFEST_FILE"
              echo "✅ Ed25519 signature verified successfully via ssh-keygen!"
            else
              echo "❌ ERROR: Neither openssl nor ssh-keygen is available for signature verification!"
              exit 1
            fi
          else
            echo "ℹ️ No signature file ($SIG_FILE) present in repository. Skipping signature check."
          fi

      - name: 5. Functional Installer Sanity Test
        run: |
          set -euo pipefail
          
          B4L_BIN="./bin/bash4llm"

          if [ ! -f "$B4L_BIN" ]; then
            echo "❌ ERROR: Executable file '$B4L_BIN' not found in repository!"
            exit 1
          fi

          chmod +x "$B4L_BIN"

          echo "🔍 Testing native extras installer..."
          INSTALL_LOG=$("$B4L_BIN" --install-extras ./extras 2>&1)
          echo "$INSTALL_LOG"

          if echo "$INSTALL_LOG" | grep -qi "integrity verification warnings"; then
            echo "❌ ERROR: Extras installer detected integrity verification warnings!"
            exit 1
          fi
          echo "✅ Installer sanity test passed!"
