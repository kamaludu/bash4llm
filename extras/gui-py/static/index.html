<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bash4LLM⁺ WebApp</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="app-container">
    <!-- Overlay for closing sidebar on mobile -->
    <div id="sidebar-overlay" class="sidebar-overlay"></div>

    <!-- Sidebar / Thread Navigator -->
    <aside class="sidebar" id="sidebar" tabindex="-1">
      <div class="sidebar-header">
        <h2 class="brand-badge">Bash4LLM⁺</h2>
        <div class="header-actions">
          <button id="btn-new-thread" class="btn btn-primary" data-i18n="new_thread">+ New Thread</button>
          <button id="btn-close-sidebar" class="btn-icon sidebar-close-btn" aria-label="Close Sidebar">✕</button>
        </div>
      </div>

      <div class="thread-list-container">
        <ul id="thread-list" class="thread-list">
          <!-- Dynamically populated by app.js -->
        </ul>
      </div>

      <div class="sidebar-footer">
        <div class="status-indicator">
          <span id="status-dot" class="status-dot ready"></span>
          <span id="status-text" data-i18n="status_ready">Ready</span>
        </div>
        <div class="footer-actions">
          <button id="btn-vault" class="btn btn-secondary btn-sm" title="Key Vault Status" data-i18n="vault">🔒 Vault</button>
          <button id="btn-settings" class="btn btn-secondary btn-sm" data-i18n="settings">Settings</button>
        </div>
      </div>
    </aside>

    <!-- Main Chat Workspace -->
    <main class="chat-viewport">
      <header class="chat-header">
        <button id="btn-toggle-sidebar" class="btn-icon" aria-label="Toggle Sidebar">☰ Menu</button>
        
        <div class="header-thread-info">
          <h3 id="current-thread-title">Default Thread</h3>
          <button id="btn-thread-stats" class="badge-stats" title="View Session Engine Snapshot" data-i18n="stats" data-i18n-title="stats">📊 Stats</button>
        </div>

        <div class="active-params-badge" id="active-params-badge">
          <span id="badge-provider">groq</span> / <span id="badge-model">default</span>
        </div>
      </header>

      <!-- Document/Terminal Style Chat Display -->
      <section id="chat-messages" class="chat-messages">
        <!-- SSE streamed messages injected here dynamically by app.js -->
      </section>

      <!-- Prompt Input Controls -->
      <footer class="input-container">
        <!-- Attachment Chips Preview Area -->
        <div id="attachment-list" class="attachment-list"></div>

        <form id="chat-form" action="/api/chat" method="POST" class="chat-form">
          <input type="hidden" name="thread_id" id="form-thread-id" value="default">
          <input type="hidden" name="stream" value="true">
          
          <div class="textarea-wrapper">
            <textarea 
              name="prompt" 
              id="prompt-input" 
              class="prompt-textarea" 
              rows="2" 
              placeholder="Type your prompt here..." 
              data-i18n-placeholder="prompt_placeholder" 
              required></textarea>
            
            <div class="input-toolbar">
              <label for="file-upload-input" class="btn-tool" title="Attach File (-f)">
                <span data-i18n="attach">📎 Attach</span>
                <input type="file" id="file-upload-input" class="hidden-file-input">
              </label>

              <select id="select-template" class="select-tool" title="Apply Prompt Template">
                <option value="" data-i18n="no_template">-- No Template --</option>
              </select>

              <label class="checkbox-tool" title="Validate SML v2.0 Safety Gate">
                <input type="checkbox" id="check-sml-gate">
                <span data-i18n="sml_gate">SML Gate</span>
              </label>
            </div>
          </div>

          <div class="input-actions">
            <button type="submit" id="btn-send" class="btn btn-submit" data-i18n="send">Send</button>
            <button type="button" id="btn-cancel" class="btn btn-danger hidden" data-i18n="cancel">Stop</button>
          </div>
        </form>
      </footer>
    </main>
  </div>

  <!-- Runtime Settings Dialog Modal -->
  <dialog id="settings-modal" class="modal">
    <div class="modal-content">
      <h3 class="highlight-title" data-i18n="settings_title">Runtime Settings</h3>
      
      <div class="form-group">
        <label for="select-provider" data-i18n="provider">Provider</label>
        <select id="select-provider" class="form-control"></select>
      </div>

      <div class="form-group">
        <label for="select-model" data-i18n="model">Model</label>
        <div class="input-with-button">
          <select id="select-model" class="form-control"></select>
          <button type="button" id="btn-set-default-model" class="btn btn-secondary btn-sm" title="Set as default model for provider" data-i18n="set_default">Set Default</button>
          <button type="button" id="btn-refresh-models" class="btn btn-secondary btn-sm" title="Refresh models list from provider">🔄</button>
        </div>
      </div>

      <div class="form-group">
        <label for="input-system-prompt" data-i18n="system_prompt">System Prompt</label>
        <textarea id="input-system-prompt" class="form-control" rows="2" placeholder="Optional system instructions..." data-i18n-placeholder="system_prompt_placeholder"></textarea>
      </div>

      <div class="form-row">
        <div class="form-group col">
          <label for="input-temperature" data-i18n="temperature">Temperature (0.0 - 2.0)</label>
          <input type="number" id="input-temperature" class="form-control" step="0.1" min="0.0" max="2.0" value="1.0">
        </div>

        <div class="form-group col">
          <label for="input-max-tokens" data-i18n="max_tokens">Max Tokens</label>
          <input type="number" id="input-max-tokens" class="form-control" step="128" min="1" max="128000" placeholder="Default (4096)" data-i18n-placeholder="max_tokens_placeholder">
        </div>
      </div>

      <div class="form-group">
        <label for="select-context-mode" data-i18n="context_strategy">Context Window Strategy</label>
        <select id="select-context-mode" class="form-control">
          <option value="messages" data-i18n="ctx_messages">Message Count Window (N Messages)</option>
          <option value="bytes" data-i18n="ctx_bytes">Token/Byte Budget Mode (Target Bytes)</option>
        </select>
      </div>

      <div class="form-group" id="group-thread-window">
        <label for="input-thread-window" data-i18n="thread_window">History Window Messages (N)</label>
        <input type="number" id="input-thread-window" class="form-control" step="1" min="1" max="100" value="10">
      </div>

      <div class="form-group hidden" id="group-target-bytes">
        <label for="select-target-bytes" data-i18n="target_budget">Token Target Budget</label>
        <select id="select-target-bytes" class="form-control">
          <option value="8192">8 KB (~2,000 Tokens)</option>
          <option value="16384">16 KB (~4,000 Tokens)</option>
          <option value="32768" selected>32 KB (~8,000 Tokens - Default)</option>
          <option value="65536">64 KB (~16,000 Tokens)</option>
          <option value="131072">128 KB (~32,000 Tokens)</option>
        </select>
      </div>

      <div class="form-group">
        <label class="checkbox-label">
          <input type="checkbox" id="check-sanitize" checked>
          <span data-i18n="sanitize_output">Enable Output Sanitization (Strip ANSI & Binaries)</span>
        </label>
      </div>

      <div class="modal-actions">
        <button id="btn-save-settings" class="btn btn-primary" data-i18n="save">Save</button>
        <button id="btn-close-settings" class="btn btn-secondary" data-i18n="close">Close</button>
      </div>
    </div>
  </dialog>

  <!-- OpenSSL Vault & Key Manager Dialog Modal -->
  <dialog id="vault-modal" class="modal">
    <div class="modal-content">
      <h3 class="highlight-title" data-i18n="vault_title">🔒 OpenSSL Key Vault</h3>
      
      <div id="vault-status-banner" class="vault-banner">
        <span id="vault-status-text">Checking Vault status...</span>
      </div>

      <!-- Unlock Section -->
      <div id="vault-unlock-section" class="form-group">
        <label for="input-master-password" data-i18n="master_password">Master Password</label>
        <input type="password" id="input-master-password" class="form-control" placeholder="Enter Master Password to unlock" data-i18n-placeholder="master_password_placeholder">
        <button type="button" id="btn-unlock-vault" class="btn btn-primary btn-block mt-2" data-i18n="unlock_session">Unlock Vault Session</button>
      </div>

      <!-- Key Manager Section (Visible when unlocked) -->
      <div id="vault-key-section" class="vault-key-section hidden">
        <h4 class="section-subtitle" data-i18n="save_api_key_title">Save Provider API Key</h4>
        
        <div class="form-group">
          <label for="select-vault-provider" data-i18n="provider">Provider</label>
          <select id="select-vault-provider" class="form-control"></select>
        </div>

        <div class="form-group">
          <label for="input-vault-api-key" data-i18n="api_key">API Key</label>
          <input type="password" id="input-vault-api-key" class="form-control" placeholder="Paste API Key here" data-i18n-placeholder="api_key_placeholder">
        </div>

        <button type="button" id="btn-save-vault-key" class="btn btn-primary btn-block" data-i18n="save_encrypted_key">Save Encrypted Key</button>
      </div>

      <div class="modal-actions">
        <button id="btn-close-vault" class="btn btn-secondary" data-i18n="close">Close</button>
      </div>
    </div>
  </dialog>

  <!-- Session Engine Snapshot Stats Modal -->
  <dialog id="snapshot-modal" class="modal">
    <div class="modal-content">
      <h3 class="highlight-title" data-i18n="snapshot_title">📊 Session Engine Snapshot</h3>
      
      <div id="snapshot-details" class="snapshot-details">
        <p>Loading session stats...</p>
      </div>

      <div class="modal-actions">
        <button id="btn-close-snapshot" class="btn btn-secondary" data-i18n="close">Close</button>
      </div>
    </div>
  </dialog>

  <script src="/static/app.js" type="module"></script>
</body>
</html>
